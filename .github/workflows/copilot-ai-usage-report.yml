# Place this file at: .github/workflows/copilot-ai-usage-report.yml
# in a repo the enterprise billing-manager/owner token can push to.
#
# Runs at 06:00 UTC on the 1st of every month, generates the detailed usage
# report for the month that just ended, and commits + uploads the CSV.

name: Copilot AI Usage Monthly Report

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC, 1st of every month
  workflow_dispatch: {}    # allows manual runs / backfills

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate report for previous month
        env:
          GITHUB_TOKEN: ${{ secrets.BILLING_PAT }}   # PAT with manage_billing:enterprise (or fine-grained "Enterprise administration" write)
          GITHUB_ENTERPRISE: ${{ vars.ENTERPRISE_SLUG }}
        run: |
          mkdir -p reports
          python copilot_ai_usage_report.py --output reports/copilot_ai_usage_$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m).csv

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-ai-usage-report
          path: reports/*.csv

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.csv
          git commit -m "Add Copilot AI usage report for $(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)" || echo "Nothing to commit"
          git push
