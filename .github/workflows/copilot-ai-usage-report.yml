# Place this file at: .github/workflows/copilot-ai-usage-report.yml
# in a repo the enterprise billing-manager/owner token can push to.
#
# Runs at 03:00 UTC (08:30 AM IST) on the 1st of every month, generates the
# detailed usage report for the month that just ended, and commits + uploads
# the CSV, then sends it via email.
#
# Required secrets:
#   COPILOT_TOKEN    — PAT with manage_billing:enterprise (or fine-grained
#                      "Enterprise administration" write permission)
#   ENTERPRISE_SLUG  — GitHub enterprise slug
#   SMTP_SERVER      — SMTP hostname (e.g. smtp.gmail.com)
#   SMTP_PORT        — SMTP port (e.g. 587 for STARTTLS)
#   SMTP_USERNAME    — SMTP login / sender address
#   SMTP_PASSWORD    — SMTP password or app-password
#   REPORT_EMAIL_TO  — Recipient address(es), comma-separated if multiple

name: Copilot AI Usage Monthly Report

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC = 08:30 AM IST, 1st of every month
  workflow_dispatch:
    inputs:
      report_month:
        description: >
          Select which month's report to generate (YYYY-MM).
          Choose the month whose data you want to pull.
        required: true
        default: '2026-07'
        type: choice
        options:
          - '2026-06'
          - '2026-07'
          - '2026-08'
          - '2026-09'
          - '2026-10'
          - '2026-11'
          - '2026-12'

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Compute report month
        id: month
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPORT_DATE="${{ inputs.report_month }}-01"
          else
            REPORT_DATE=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-01)
          fi
          YEAR=$(date -d "$REPORT_DATE" +%Y)
          MONTH=$(date -d "$REPORT_DATE" +%-m)
          LABEL=$(date -d "$REPORT_DATE" +%Y-%m)
          echo "year=$YEAR"   >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Generate report for selected month
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}   # PAT with manage_billing:enterprise (or fine-grained "Enterprise administration" write)
          GITHUB_ENTERPRISE: ${{ secrets.ENTERPRISE_SLUG }}
        run: |
          mkdir -p reports
          python scripts/copilot_ai_usage_report.py \
            --year ${{ steps.month.outputs.year }} \
            --month ${{ steps.month.outputs.month }} \
            --output reports/copilot_ai_usage_${{ steps.month.outputs.label }}.csv

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-ai-usage-report
          path: reports/*.csv

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.csv
          git commit -m "Add Copilot AI usage report for ${{ steps.month.outputs.label }}" || echo "Nothing to commit"
          git push

      - name: Send report via email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_LABEL: ${{ steps.month.outputs.label }}
        run: |
          python - <<'EOF'
          import os, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders

          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port   = int(os.environ.get("SMTP_PORT", "587"))
          smtp_user   = os.environ["SMTP_USERNAME"]
          smtp_pass   = os.environ["SMTP_PASSWORD"]
          email_to    = os.environ["EMAIL_TO"]
          label       = os.environ["REPORT_LABEL"]

          msg = MIMEMultipart()
          msg["From"]    = smtp_user
          msg["To"]      = email_to
          msg["Subject"] = f"Copilot AI Usage Report \u2014 {label}"

          body = f"Please find attached the Copilot AI Usage Report for {label}."
          msg.attach(MIMEText(body, "plain"))

          csv_file = f"reports/copilot_ai_usage_{label}.csv"
          if os.path.exists(csv_file):
              with open(csv_file, "rb") as f:
                  part = MIMEBase("application", "octet-stream")
                  part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header(
                  "Content-Disposition",
                  f"attachment; filename={os.path.basename(csv_file)}"
              )
              msg.attach(part)

          recipients = [e.strip() for e in email_to.split(",") if e.strip()]
          try:
              with smtplib.SMTP(smtp_server, smtp_port) as server:
                  server.starttls()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, recipients, msg.as_string())
              print("Email sent successfully.")
          except Exception as exc:
              print(f"ERROR: Failed to send email — {exc}", flush=True)
              raise SystemExit(1) from exc
          EOF
